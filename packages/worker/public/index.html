<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PreBase — Build AI Chatbots from Your Content</title>
  <meta name="description" content="Create and manage AI-powered chatbots for your website. Upload your content, configure your bot, and embed it anywhere.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%232563eb'/><text x='50%' y='55%' font-family='system-ui' font-size='18' font-weight='700' fill='white' text-anchor='middle' dominant-baseline='middle'>P</text></svg>">
  <link rel="stylesheet" href="/css/style.css?v=5">
</head>
<body>
  <!-- Auth pages render here (full page, no topbar) -->
  <div id="auth-root"></div>

  <!-- Dashboard app shell (shown when authenticated) -->
  <div id="app" style="display:none;">
    <nav id="topbar" role="banner">
      <a href="#dashboard" class="topbar-brand" aria-label="PreBase Home">
        <div class="topbar-brand-icon" aria-hidden="true">PB</div>
        <span>PreBase</span>
      </a>
      <div class="topbar-spacer"></div>
      <div class="topbar-user">
        <span class="topbar-user-email" id="topbar-email" aria-label="Signed in as"></span>
        <button class="btn btn-ghost btn-sm" id="logout-btn" aria-label="Sign out">Sign out</button>
      </div>
    </nav>
    <main id="main" role="main">
      <!-- Views render here -->
    </main>
  </div>
  
  <footer style="text-align: center; padding: 20px; font-size: 14px; color: #64748b; margin-top: auto;">
    <a href="/privacy.html" style="color: inherit; text-decoration: none; margin-right: 16px;">Privacy Policy</a>
    <a href="/terms.html" style="color: inherit; text-decoration: none;">Terms of Service</a>
  </footer>
  <!-- Toast notification container -->
  <div id="toast-container" aria-live="polite" aria-atomic="false"></div>

  <script type="module" src="/js/app.js?v=5"></script>
</body>
</html>
