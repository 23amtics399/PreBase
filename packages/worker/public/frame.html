<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PreBase Chat</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --chip-bg: #eff6ff;
      --chip-border: #bfdbfe;
      --chip-text: #1d4ed8;
      --chip-bg-hover: #dbeafe;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: white;
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }
    header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }
    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
    }
    .close-btn:hover {
      color: var(--text);
    }
    #chat-container {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
    }
    .message.user {
      align-self: flex-end;
      background: var(--primary);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .message.bot {
      align-self: flex-start;
      background: white;
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .message.system {
      align-self: center;
      background: none;
      color: var(--text-muted);
      font-size: 12px;
    }
    /* Quick Answer chips */
    .chips-container {
      align-self: flex-start;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-width: 100%;
    }
    .chip {
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      color: var(--chip-text);
      border-radius: 16px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }
    .chip:hover {
      background: var(--chip-bg-hover);
      transform: translateY(-1px);
    }
    /* Fallback/quota-exhausted banner */
    .quota-banner {
      align-self: stretch;
      background: #fef9c3;
      border: 1px solid #fde68a;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 13px;
      color: #92400e;
      line-height: 1.4;
    }
    .input-area {
      padding: 16px;
      background: white;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 20px;
      outline: none;
      font-size: 14px;
    }
    input[type="text"]:focus {
      border-color: var(--primary);
    }
    button[type="submit"] {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button[type="submit"]:hover {
      opacity: 0.9;
    }
    button[type="submit"]:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 4px 8px;
    }
    .typing-indicator span {
      width: 6px;
      height: 6px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <header>
    <h1 id="header-title">Chat</h1>
    <button class="close-btn" id="close-widget" aria-label="Close">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </header>
  
  <div id="chat-container">
    <!-- Messages go here -->
  </div>

  <div class="input-area" id="chat-input-area">
    <input type="text" id="message-input" placeholder="Type your message..." autocomplete="off" disabled>
    <button type="submit" id="send-btn" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const botId = urlParams.get('bot') || urlParams.get('botId');
    
    const chatContainer = document.getElementById('chat-container');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const headerTitle = document.getElementById('header-title');

    // Persistent visitor ID for burst rate limiting
    let visitorId = null;
    try {
      visitorId = localStorage.getItem('pb_visitor_id');
      if (!visitorId) {
        visitorId = crypto.randomUUID ? crypto.randomUUID() : (Math.random().toString(36).slice(2) + Date.now().toString(36));
        localStorage.setItem('pb_visitor_id', visitorId);
      }
    } catch(e) { /* localStorage blocked — fallback to null (server uses IP) */ }

    // Bot-level state
    let globalQuickAnswers = []; // items configured by owner

    function addMessage(text, role) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;
      msgDiv.textContent = text;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function addSystemMessage(text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message system';
      msgDiv.textContent = text;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    /**
     * Renders clickable quick-answer chips. When a chip is clicked it submits
     * the selection via the /chat/menu-respond endpoint and displays the
     * owner-authored response.
     *
     * @param {Array<{id, label, response}>} items
     * @param {boolean} isFallback - true when shown due to quota exhaustion
     */
    function renderChips(items, isFallback = false) {
      if (!items || items.length === 0) return;
      const container = document.createElement('div');
      container.className = 'chips-container';
      items.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'chip';
        btn.textContent = item.label;
        btn.dataset.itemId = item.id;
        btn.addEventListener('click', async () => {
          // Remove the chips row so the user sees a clean thread
          container.remove();
          addMessage(item.label, 'user');
          showTyping();
          try {
            const res = await fetch('/api/widget/chat/menu-respond', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ botId, itemId: item.id, visitorId })
            });
            hideTyping();
            if (res.ok) {
              const data = await res.json();
              addMessage(data.answer, 'bot');
              // Show chips again so the visitor can ask another quick question
              if (globalQuickAnswers.length > 0) {
                renderChips(globalQuickAnswers);
              }
            } else {
              addSystemMessage('Could not retrieve answer. Please try again.');
            }
          } catch(e) {
            hideTyping();
            addSystemMessage('Network error.');
          }
        });
        container.appendChild(btn);
      });
      chatContainer.appendChild(container);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    /**
     * Renders the quota-exhausted fallback UI. Shows a banner and, if
     * the bot has menu items, clickable chips. If not, shows support contact.
     */
    function renderQuotaFallback(data) {
      const banner = document.createElement('div');
      banner.className = 'quota-banner';
      banner.textContent = data.fallback_message ||
        "Today's AI limit has been reached. You can use the Quick Answers below.";
      chatContainer.appendChild(banner);

      if (data.menu && data.menu.length > 0) {
        renderChips(data.menu, true);
      } else if (data.support_contact) {
        addSystemMessage(`For support: ${data.support_contact}`);
      } else {
        addSystemMessage('Please check back tomorrow or contact the site administrator.');
      }
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    let typingDiv = null;
    function showTyping() {
      if (typingDiv) return;
      typingDiv = document.createElement('div');
      typingDiv.className = 'message bot';
      typingDiv.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
      chatContainer.appendChild(typingDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
    
    function hideTyping() {
      if (typingDiv) {
        typingDiv.remove();
        typingDiv = null;
      }
    }

    // Initialize
    if (!botId) {
      addSystemMessage('Error: No bot ID provided.');
    } else {
      // Fetch bot info including quick_answers
      fetch(`/api/widget/bot/${encodeURIComponent(botId)}`)
        .then(res => {
          if (!res.ok) {
            if (res.status === 404) throw new Error('Bot not found or unavailable.');
            throw new Error('Failed to load bot information.');
          }
          return res.json();
        })
        .then(data => {
          headerTitle.textContent = data.name || 'Chat';
          messageInput.disabled = false;
          sendBtn.disabled = false;
          addSystemMessage('Connected.');
          // Render initial quick-answer chips if enabled
          if (data.quick_answers && data.quick_answers.length > 0) {
            globalQuickAnswers = data.quick_answers;
            renderChips(globalQuickAnswers);
          }
        })
        .catch(err => {
          addSystemMessage(err.message);
        });
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || !botId) return;

      messageInput.value = '';
      addMessage(text, 'user');
      showTyping();
      
      messageInput.disabled = true;
      sendBtn.disabled = true;

      try {
        const response = await fetch('/api/widget/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            botId: botId,
            message: text,
            visitorId: visitorId
          })
        });
        
        hideTyping();

        if (response.status === 429) {
          addSystemMessage('Too many messages. Please wait a moment before sending more.');
        } else if (!response.ok) {
          addSystemMessage('An error occurred. Please try again.');
        } else {
          const data = await response.json();

          if (data.quota_exhausted) {
            // AI quota exhausted — render fallback gracefully
            renderQuotaFallback(data);
          } else {
            addMessage(data.answer, 'bot');
            // Show quick-answer chips after each AI reply if enabled
            if (data.quick_answers && data.quick_answers.length > 0) {
              globalQuickAnswers = data.quick_answers;
              renderChips(globalQuickAnswers);
            }
          }
        }
      } catch (err) {
        hideTyping();
        addSystemMessage('Network error.');
      } finally {
        messageInput.disabled = false;
        sendBtn.disabled = false;
        messageInput.focus();
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
      }
    });

    // Close button sends message to host
    document.getElementById('close-widget').addEventListener('click', () => {
      window.parent.postMessage({ type: 'PREBASE_WIDGET_CLOSE' }, '*');
    });

    // Listen for open event to focus input
    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'PREBASE_WIDGET_OPEN') {
        if (!messageInput.disabled) {
          messageInput.focus();
        }
      }
    });
  </script>
</body>
</html>
