<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PreBase Chat</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: white;
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }
    header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }
    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
    }
    .close-btn:hover {
      color: var(--text);
    }
    #chat-container {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
    }
    .message.user {
      align-self: flex-end;
      background: var(--primary);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .message.bot {
      align-self: flex-start;
      background: white;
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .message.system {
      align-self: center;
      background: none;
      color: var(--text-muted);
      font-size: 12px;
    }
    .input-area {
      padding: 16px;
      background: white;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 20px;
      outline: none;
      font-size: 14px;
    }
    input[type="text"]:focus {
      border-color: var(--primary);
    }
    button[type="submit"] {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button[type="submit"]:hover {
      opacity: 0.9;
    }
    button[type="submit"]:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 4px 8px;
    }
    .typing-indicator span {
      width: 6px;
      height: 6px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <header>
    <h1 id="header-title">Chat</h1>
    <button class="close-btn" id="close-widget" aria-label="Close">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </header>
  
  <div id="chat-container">
    <!-- Messages go here -->
  </div>

  <div class="input-area" id="chat-input-area">
    <input type="text" id="message-input" placeholder="Type your message..." autocomplete="off" disabled>
    <button type="button" id="send-btn" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const botId = urlParams.get('bot');
    
    const chatContainer = document.getElementById('chat-container');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const headerTitle = document.getElementById('header-title');

    function addMessage(text, role) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;
      msgDiv.textContent = text;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function addSystemMessage(text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message system';
      msgDiv.textContent = text;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    let typingDiv = null;
    function showTyping() {
      if (typingDiv) return;
      typingDiv = document.createElement('div');
      typingDiv.className = 'message bot';
      typingDiv.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
      chatContainer.appendChild(typingDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
    
    function hideTyping() {
      if (typingDiv) {
        typingDiv.remove();
        typingDiv = null;
      }
    }

    // Initialize
    if (!botId) {
      addSystemMessage('Error: No bot ID provided.');
    } else {
      // Fetch bot info
      fetch(`/api/widget/bot/${encodeURIComponent(botId)}`)
        .then(res => {
          if (!res.ok) {
            if (res.status === 404) throw new Error('Bot not found or unavailable.');
            throw new Error('Failed to load bot information.');
          }
          return res.json();
        })
        .then(data => {
          headerTitle.textContent = data.name || 'Chat';
          messageInput.disabled = false;
          sendBtn.disabled = false;
          addSystemMessage('Connected.');
        })
        .catch(err => {
          addSystemMessage(err.message);
        });
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || !botId) return;

      messageInput.value = '';
      addMessage(text, 'user');
      showTyping();
      
      messageInput.disabled = true;
      sendBtn.disabled = true;

      try {
        const response = await fetch('/api/widget/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            botId: botId,
            message: text
          })
        });
        
        hideTyping();
        
        if (response.status === 429) {
          addSystemMessage('Rate limit exceeded. Please try again later.');
        } else if (!response.ok) {
          addSystemMessage('An error occurred.');
        } else {
          const data = await response.json();
          addMessage(data.answer, 'bot');
        }
      } catch (err) {
        hideTyping();
        addSystemMessage('Network error.');
      } finally {
        messageInput.disabled = false;
        sendBtn.disabled = false;
        messageInput.focus();
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
      }
    });

    // Close button sends message to host
    document.getElementById('close-widget').addEventListener('click', () => {
      window.parent.postMessage({ type: 'PREBASE_WIDGET_CLOSE' }, '*');
    });

    // Listen for open event to focus input
    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'PREBASE_WIDGET_OPEN') {
        if (!messageInput.disabled) {
          messageInput.focus();
        }
      }
    });
  </script>
</body>
</html>
